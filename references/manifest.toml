# Reference repos, synced into references/<name>/ by `mise run refs`
# (tools/fetch_references.py). Checkouts are shallow and gitignored.
#
# Fields: name, url, optional `ref` (branch/tag/commit; defaults to upstream HEAD),
# and `notes` on what's worth looking at.

[[repo]]
name = "screendrop"
url = "https://github.com/fayazara/Screendrop"
notes = "macOS screenshot/recording app; the feature and UX bar (preview stack, annotation editor, recording studio)."

[[repo]]
name = "omarchy"
url = "https://github.com/omacom/omarchy"
notes = "bin/omarchy-capture-*: the grim/slurp and recorder scripts screenie replaces (smart region picking, recording finalize)."

[[repo]]
name = "gpui-component"
url = "https://github.com/longbridge/gpui-component"
notes = "GPUI component library screenie's UI uses; crates/story has usage examples for every component."

[[repo]]
name = "wlroots"
url = "https://gitlab.freedesktop.org/wlroots/wlroots"
notes = """
The compositor library behind sway, river and others (and the protocol reference for
most wlroots-family compositors). Capture: types/wlr_screencopy_v1.c,
types/ext_image_capture_source_v1/ (output.c locks direct scanout for an output
session; scene.c renders a window by itself), types/wlr_linux_dmabuf_v1.c (feedback).
Direct scanout: types/scene/wlr_scene.c, types/output/render.c.
"""

[[repo]]
name = "sway"
url = "https://github.com/swaywm/sway"
notes = """
The compositor the headless test session runs. sway/desktop/layer_shell.c (how layer
surfaces are placed), sway/ipc-json.c (the toplevel identifiers windows are matched by),
sway/tree/view.c (foreign-toplevel handles).
"""
