name: Set up
description: The system libraries screenie builds against, and stable Rust.

inputs:
  components:
    description: Extra rustup components, comma-separated.
    default: ""

runs:
  using: composite
  steps:
    - name: Install system libraries
      shell: bash
      run: |
        # Skip rebuilding the man page index after installing, which takes longer than the install.
        sudo rm -f /var/lib/man-db/auto-update
        # The 22.04 images' LLVM brings libunwind-14-dev, which conflicts with the
        # libunwind-dev that GStreamer's headers need.
        # (dpkg-query fails when nothing matches, as on 24.04.)
        conflicting=$(dpkg-query -W -f '${db:Status-Abbrev} ${Package}\n' 'libunwind-*-dev' 2>/dev/null |
          awk '$1 == "ii" { print $2 }' || true)
        if [ -n "$conflicting" ]; then sudo apt-get remove -y -q $conflicting; fi
        sudo apt-get update -qq
        sudo apt-get install -y -q --no-install-recommends \
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
          libxkbcommon-dev libxkbcommon-x11-dev libgbm-dev libfontconfig-dev

    # Before rust-cache, which keys on the compiler's version.
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}
