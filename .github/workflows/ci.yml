name: CI

# Formatting, lints and tests. Publish runs these on a tag before it releases it.
on:
  push:
    branches: [main]
    # Only Rust and Cargo changes, and what the crates embed.
    paths: &paths
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "patches/**"
      - "assets/**"
      - "!**/*.md"
      - "README.md" # a test parses its config examples
      - ".github/workflows/ci.yml"
      - ".github/actions/**"
  pull_request:
    paths: *paths
  workflow_dispatch:
  workflow_call:

# One run per ref at a time: a newer push replaces a waiting run, and on a pull request
# it cancels the running one too. Not `github.workflow`, which in a run Publish calls is
# Publish: this would wait on Publish's own group.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Nothing here runs a debugger, and without line tables the cached target dirs are
  # smaller, so they save and restore faster.
  CARGO_PROFILE_DEV_DEBUG: 0

# Caching: lint and test each keep their target dir with Swatinem/rust-cache
# (dependencies only; the workspace's crates are rebuilt). Only main saves, so pull
# requests and tags build on main's cache without adding their own and evicting it.

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      # The GNOME Shell extension only runs in GNOME Shell, at login: at least it parses.
      - name: Check the GNOME Shell extension parses
        run: |
          for f in crates/screenie-desktop/extension/*.js; do
            node --input-type=module --check < "$f" || { echo "::error file=$f::Doesn't parse"; exit 1; }
          done
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Keep the dependencies built before a lint failed.
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo test --workspace --locked
