[package]
name = "wlinput"
description = "Test tool: drive a compositor's pointer and keyboard (virtual input protocols, or KWin's fake input)"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
screenie-wayland.workspace = true
wayland-client.workspace = true
wayland-protocols-wlr.workspace = true
wayland-protocols-plasma.workspace = true
wayland-protocols-misc = { version = "0.3", features = ["client"] }
xkbcommon = { version = "0.9", default-features = false }
rustix.workspace = true
