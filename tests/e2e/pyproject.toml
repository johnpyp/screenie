[project]
name = "screenie-e2e"
version = "0"
description = "End-to-end tests: screenie driven in a headless sway session"
requires-python = ">=3.11"
dependencies = ["pytest>=8", "pytest-timeout>=2", "pillow>=10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
# One compositor and one seat: tests share keyboard focus, so they run one at a time.
timeout = 60
addopts = "-ra"
